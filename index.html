<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Source Explorer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header>
        <h1>Open Source Explorer</h1>
        <p class="subhead">
          Search any GitHub organization and explore its public repositories.
        </p>
      </header>

      <!-- Search -->
      <section class="search-section" aria-label="Organization search">
        <form class="search-form" id="search-form" role="search">
          <label for="org-input">Organization</label>
          <input
            type="text"
            id="org-input"
            name="org-input"
            placeholder="e.g. google, vercel, microsoft"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit">Search</button>
        </form>
      </section>

      <!-- Error message -->
      <div id="error" class="message-box error hidden" role="alert">
        <span id="error-message">Something went wrong.</span>
      </div>

      <!-- Organization info -->
      <section id="org-info" aria-label="Organization profile">
        <div class="org-card" id="org-card">
          <div class="org-header">
            <h2 id="org-name">Organization Name</h2>
          </div>
          <p class="org-description" id="org-description">
            Organization description goes here.
          </p>
          <div class="org-links">
            <a id="org-url" href="#" target="_blank" rel="noopener noreferrer"
              >GitHub Profile</a
            >
            <a
              id="org-website"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              >Website</a
            >
          </div>
        </div>
      </section>

      <!-- Repository list -->
      <section id="repo-section" aria-label="Repository list">
        <h2>Repositories</h2>
        <ul id="repo-list" class="repo-list">
          <!-- Dynamic content -->
        </ul>
      </section>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
